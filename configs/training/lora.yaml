paths:
  split_file: configs/splits/msd_spleen.json
  data_dir: dataset/Task09_Spleen/Task09_Spleen
  weights_path: synapse_weights/model_final_checkpoint.model

training:
  max_epochs: 5
  val_interval: 2
  batch_size: 1
  learning_rate: 0.005
  weight_decay: 0.00001
  early_stopping_patience: 15
  roi_size: [64, 128, 128]
  sw_batch_size: 4

peft:
  method: lora
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
    target_attr: ["qkvv", "out_proj", "out_proj2"]
