paths:
  data_dir: "/kaggle/input/datasets/chanhhieudo/task09-spleen/Task09_Spleen"
  weights_path: "/kaggle/input/models/amr2054/unetr-synapse/pytorch/default/1/model_final_checkpoint.model"

training:
  max_epochs: 300
  val_interval: 2
  batch_size: 2
  learning_rate: 0.005
  weight_decay: 0.00001
  early_stopping_patience: 15
  roi_size: [64, 128, 128]
  sw_batch_size: 4
  resume_dir: ""
  freeze_backbone: True

peft:
  method: "lora"   # one of: full_finetune | linear_probe | lora
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
    target_attr:  ["qkvv", "out_proj", "out_proj2"]